<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Adaptive STACK Tutor</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [
                    ["\\(", "\\)"],
                    ["$", "$"]
                ]
            }
        };
    </script>

    <script
        async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 820px;
            margin: 0 auto;
            padding: 32px;
            line-height: 1.6;
            background: #f7f8fa;
            color: #1f2937;
        }

        .header {
            margin-bottom: 26px;
        }

        .subtitle {
            color: #667085;
        }

        .question-panel {
            background: white;
            border: 1px solid #d9dde5;
            border-radius: 10px;
            padding: 26px;
        }

        #questionTitle {
            font-size: 20px;
            margin-bottom: 18px;
        }

        #questionHtml {
            margin-bottom: 22px;
        }

        button {
            border: 0;
            border-radius: 6px;
            background: #1f5fbf;
            color: white;
            padding: 11px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .feedback {
            margin: 18px 0;
            font-weight: 600;
        }

        .status {
            margin-top: 18px;
        }

        .error {
            color: #b42318;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Adaptive STACK Tutor</h1>

        <div class="subtitle">
            Learner session
        </div>
    </div>

    <section
        id="questionPanel"
        class="question-panel hidden"
    >
        <div id="questionTitle"></div>

        <div
            id="feedback"
            class="feedback"
        ></div>

        <div id="questionHtml"></div>

        <button id="submitButton">
            Submit Answer
        </button>
    </section>

    <div
        id="status"
        class="status"
    >
        Loading learner session...
    </div>

    <script>
        let sessionId = null;
        let learnerId = null;
        let currentInputs = {};

        const questionPanel =
            document.getElementById(
                "questionPanel"
            );

        const questionTitle =
            document.getElementById(
                "questionTitle"
            );

        const questionHtml =
            document.getElementById(
                "questionHtml"
            );

        const feedback =
            document.getElementById(
                "feedback"
            );

        const status =
            document.getElementById(
                "status"
            );


        function getSessionId() {
            const parts =
                window.location.pathname
                    .split("/")
                    .filter(Boolean);

            if (
                parts.length < 2
                || parts[0] !== "student"
            ) {
                return null;
            }

            return decodeURIComponent(
                parts[1]
            );
        }


        function showStatus(
            message,
            error = false
        ) {
            status.textContent =
                message;

            status.className =
                error
                ? "status error"
                : "status";
        }


        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function renderQuestion(
            payload
        ) {
            learnerId =
                payload.learner_id;

            currentInputs =
                payload.inputs || {};

            questionTitle.innerHTML =
                "<strong>"
                + escapeHtml(
                    payload.title
                )
                + "</strong>";

            questionHtml.innerHTML =
                payload.html || "";

            feedback.textContent = "";

            if (
                payload.previous_score
                !== null
                && payload.previous_score
                !== undefined
            ) {
                if (
                    payload.previous_score >= 1
                ) {
                    feedback.textContent =
                        "Correct. Here is your next question.";
                }
                else if (
                    payload.previous_score > 0
                ) {
                    feedback.textContent =
                        "Partially correct. "
                        + "Here is your next question.";
                }
                else {
                    feedback.textContent =
                        "Your response was recorded. "
                        + "Here is your next question.";
                }
            }

            questionPanel.classList.remove(
                "hidden"
            );

            showStatus("");

            if (
                window.MathJax
                && window.MathJax.typesetPromise
            ) {
                window.MathJax
                    .typesetPromise(
                        [questionHtml]
                    )
                    .catch(
                        error => {
                            console.error(
                                "MathJax rendering failed:",
                                error
                            );
                        }
                    );
            }
        }


        async function loadSession() {
            sessionId =
                getSessionId();

            if (!sessionId) {
                showStatus(
                    "Invalid learner session link.",
                    true
                );

                return;
            }

            try {
                const response =
                    await fetch(
                        "/api/adaptive/sessions/"
                        + encodeURIComponent(
                            sessionId
                        )
                    );

                const payload =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        payload.detail
                        || "Could not load learner session."
                    );
                }

                renderQuestion(
                    payload
                );
            }
            catch (error) {
                showStatus(
                    error.message,
                    true
                );
            }
        }


        async function submitAnswer() {
            if (
                !sessionId
                || !learnerId
            ) {
                showStatus(
                    "No active learner session.",
                    true
                );

                return;
            }

            const answers = {};

            const expectedInputs =
                Object.keys(
                    currentInputs || {}
                );

            for (
                const answerName
                of expectedInputs
            ) {
                const candidates = [
                    answerName,
                    "student-" + answerName
                ];

                let input = null;

                for (
                    const candidate
                    of candidates
                ) {
                    input =
                        questionHtml.querySelector(
                            '[name="'
                            + CSS.escape(candidate)
                            + '"], #'
                            + CSS.escape(candidate)
                        );

                    if (input) {
                        break;
                    }
                }

                if (!input) {
                    continue;
                }

                if (
                    (
                        input.type === "checkbox"
                        || input.type === "radio"
                    )
                    && !input.checked
                ) {
                    continue;
                }

                answers[
                    answerName
                ] = input.value;
            }

            if (
                Object.keys(
                    answers
                ).length === 0
            ) {
                const renderedInputs =
                    questionHtml.querySelectorAll(
                        "input, textarea, select"
                    );

                for (
                    const input
                    of renderedInputs
                ) {
                    let inputName =
                        input.name
                        || input.id
                        || "";

                    if (
                        inputName.startsWith(
                            "student-"
                        )
                    ) {
                        inputName =
                            inputName.substring(
                                "student-".length
                            );
                    }

                    if (!inputName) {
                        continue;
                    }

                    if (
                        (
                            input.type === "checkbox"
                            || input.type === "radio"
                        )
                        && !input.checked
                    ) {
                        continue;
                    }

                    answers[
                        inputName
                    ] = input.value;
                }
            }

            if (
                Object.keys(
                    answers
                ).length === 0
            ) {
                showStatus(
                    "No answer field was found.",
                    true
                );

                return;
            }

            try {
                const response =
                    await fetch(
                        "/api/adaptive/sessions/"
                        + encodeURIComponent(
                            sessionId
                        )
                        + "/answers",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                learner_id:
                                    learnerId,

                                answers:
                                    answers
                            })
                        }
                    );

                const payload =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        payload.detail
                        || "Could not submit answer."
                    );
                }

                renderQuestion(
                    payload
                );
            }
            catch (error) {
                showStatus(
                    error.message,
                    true
                );
            }
        }


        document.getElementById(
            "submitButton"
        ).addEventListener(
            "click",
            submitAnswer
        );


        loadSession();
    </script>
</body>
</html>
